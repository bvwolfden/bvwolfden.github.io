name: Deploy Blue Team Playbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # The repository also runs GitHub's branch-based Jekyll publisher.
      # Finish that run first so it cannot overwrite this Next.js export.
      - name: Wait for branch-based Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            for (let attempt = 0; attempt < 120; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: context.sha, per_page: 100
              });
              const branchRuns = data.workflow_runs.filter(run =>
                run.id !== context.runId &&
                run.path === 'dynamic/pages/pages-build-deployment'
              );
              if (branchRuns.length && branchRuns.every(run => run.status === 'completed')) {
                core.info('Branch-based Pages publisher has finished; publishing the playbook last.');
                return;
              }
              if (!branchRuns.length && attempt >= 12) {
                core.info('No branch-based Pages publisher found.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Branch-based Pages publisher did not finish in time.');
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
